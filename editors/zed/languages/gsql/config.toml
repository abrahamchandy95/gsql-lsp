name = "GSQL"
grammar = "gsql"
path_suffixes = ["gsql", "gsq"]
line_comments = ["// ", "# "]
block_comment = ["/* ", " */"]
tab_size = 4
hard_tabs = false
autoclose_before = ";:.,=}])>"
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
