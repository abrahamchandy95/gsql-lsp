name: Release

# Push a tag such as `v0.2.0` (matching the version in Cargo.toml) to build
# gsql-lsp for every platform and publish a GitHub release with the binaries
# and platform-specific VS Code extensions that bundle them.
#
# Asset names carry no version, so `releases/latest/download/<name>` works:
#   gsql-lsp-<target>.tar.gz (zip on Windows)   binary + README + LICENSE in a
#                                                gsql-lsp-<target>/ directory
#   gsql-<platform>.vsix                         VS Code extensions
#   SHA256SUMS                                   `sha256sum` format, covers the above
#   gsql-lsp.rb                                  Homebrew formula for this version
#   install.sh                                   the installer script
# Optional publishing (crates.io, VS Code Marketplace, Open VSX) runs when the
# repository secrets CARGO_REGISTRY_TOKEN, VSCE_PAT, OVSX_PAT exist; tags with a
# `-` (v0.2.0-rc.1) are marked pre-release and are never published.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the crate version
        run: |
          # `cargo pkgid` prints `...#0.2.0` or `...#gsql-lsp@0.2.0`.
          version="$(cargo pkgid -p gsql-lsp | sed -E 's/.*[#@]//')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match gsql-lsp $version" >&2
            exit 1
          fi
          # Every package carries the same version (scripts/set_version.py).
          for f in tree-sitter-gsql/Cargo.toml editors/vscode/package.json; do
            if ! grep -Eq "^\s*\"?version\"?\s*[=:]\s*\"$version\"" "$f"; then
              echo "$f is not at version $version" >&2
              exit 1
            fi
          done
          # The Zed grammar must point at a real commit (docs/deployment.md, step 3).
          if grep -q '^rev = "0\{40\}"' editors/zed/extension.toml; then
            echo "editors/zed/extension.toml still has the placeholder grammar rev" >&2
            exit 1
          fi

  build:
    needs: check-version
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, archive: tar.gz }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, archive: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        env:
          # cc-rs would otherwise look for a `<arch>-linux-musl-gcc` prefix.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked -p gsql-lsp --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="gsql-lsp-${{ matrix.target }}"
          mkdir -p "dist/$name"
          exe=""; [ "${{ matrix.archive }}" = zip ] && exe=".exe"
          cp "target/${{ matrix.target }}/release/gsql-lsp$exe" README.md LICENSE "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
          # The bare binary, for bundling into the VS Code extension.
          mkdir -p "../server-${{ matrix.target }}"
          cp "../target/${{ matrix.target }}/release/gsql-lsp$exe" "../server-${{ matrix.target }}/"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: server-${{ matrix.target }}/*

  vscode:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, vscode: linux-x64 alpine-x64 }
          - { target: aarch64-unknown-linux-musl, vscode: linux-arm64 alpine-arm64 }
          - { target: x86_64-apple-darwin, vscode: darwin-x64 }
          - { target: aarch64-apple-darwin, vscode: darwin-arm64 }
          - { target: x86_64-pc-windows-msvc, vscode: win32-x64 }
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: editors/vscode/server
      - run: npm install
      - name: Package
        run: |
          chmod +x server/gsql-lsp 2>/dev/null || true
          for platform in ${{ matrix.vscode }}; do
            npx vsce package --target "$platform" -o "gsql-$platform.vsix"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: editors/vscode/*.vsix

  release:
    needs: [build, vscode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: archive-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vsix-*
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS
      - name: Homebrew formula and installer
        run: |
          python3 scripts/homebrew_formula.py --version "${GITHUB_REF_NAME#v}" \
            --checksums artifacts/SHA256SUMS --output artifacts/gsql-lsp.rb
          cp scripts/install.sh artifacts/install.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" $flags artifacts/*

  publish-extensions:
    name: Publish VS Code extensions
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: vsix
          pattern: vsix-*
          merge-multiple: true
      - name: Visual Studio Marketplace
        run: |
          [ -n "$VSCE_PAT" ] || { echo "VSCE_PAT not set; skipping"; exit 0; }
          for f in vsix/*.vsix; do npx --yes @vscode/vsce publish --packagePath "$f"; done
      - name: Open VSX
        run: |
          [ -n "$OVSX_PAT" ] || { echo "OVSX_PAT not set; skipping"; exit 0; }
          for f in vsix/*.vsix; do npx --yes ovsx publish "$f" -p "$OVSX_PAT"; done

  publish-crates:
    name: Publish to crates.io
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish tree-sitter-gsql, then gsql-lsp
        run: |
          [ -n "$CARGO_REGISTRY_TOKEN" ] || { echo "CARGO_REGISTRY_TOKEN not set; skipping"; exit 0; }
          # Re-running after a partial failure must not stop at a crate that is already published.
          cargo publish --locked -p tree-sitter-gsql || cargo info "tree-sitter-gsql@${GITHUB_REF_NAME#v}" >/dev/null 2>&1 \
            || exit 1
          # The index needs a moment before gsql-lsp can resolve the new grammar.
          for i in 1 2 3 4 5 6; do
            cargo publish --locked -p gsql-lsp && exit 0
            sleep 20
          done
          exit 1
