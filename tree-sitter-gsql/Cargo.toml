[package]
authors = ["Abraham Chandy"]
autoexamples = false
categories = ["parser-implementations", "parsing", "text-editors"]
description = "TigerGraph GSQL grammar for tree-sitter"
edition = "2024"
keywords = ["incremental", "parsing", "tree-sitter", "gsql"]
license = "MIT"
name = "tree-sitter-gsql"
readme = "README.md"
repository = "https://github.com/abrahamchandy95/gsql-lsp"
rust-version = "1.85"
version = "0.1.0-rc.1"

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.0"
