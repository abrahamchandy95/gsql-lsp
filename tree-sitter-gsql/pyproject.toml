[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=62.4.0", "wheel"]

[project]
authors = [{ email = "abraham.chandy95@gmail.com", name = "Abraham Chandy" }]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
description = "TigerGraph GSQL grammar for tree-sitter"
keywords = ["incremental", "parsing", "tree-sitter", "gsql"]
license.text = "MIT"
name = "tree-sitter-gsql"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0-rc.1"

[project.urls]
Homepage = "https://github.com/abrahamchandy95/gsql-lsp"

[project.optional-dependencies]
core = ["tree-sitter~=0.24"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
